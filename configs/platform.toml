[app]
port = 8080
session_name = "dws-session"
session_key = "0123456789abcdef0123456789abcdef" # 32 chars
aes_key = "fedcba9876543210fedcba9876543210"       # must be 16/24/32 chars

[database]
host = "127.0.0.1"
port = 5432
user = "admin"
password = "123456"
name = "postgres"
ssl_mode = "disable"
max_idle_conns = 5
max_open_conns = 20
conn_max_lifetime = "30m"
conn_max_idle_time = "10m"

[docker]
host = "unix:///var/run/docker.sock"
api_version = ""
ssh_port_range_start = 22000
ssh_port_range_end = 22999
allowed_images = ["ubuntu:22.04", "nvidia/cuda:12.4.1-base-ubuntu22.04"]
network = ""

[rbac]
auto_seed = true
