[app]
port = 8080
session_name = "dws-session"
session_key = "replace-with-random-32-byte-secret"
aes_key = "replace-with-random-32-byte-secret"

[database]
host = "127.0.0.1"
port = 5432
user = "admin"
password = "123456"
name = "dws"
ssl_mode = "disable"
migrations = true
max_idle_conns = 5
max_open_conns = 20
conn_max_lifetime = "30m"
conn_max_idle_time = "10m"

[docker]
host = "unix:///var/run/docker.sock"
api_version = ""
ssh_port_range_start = 22000
ssh_port_range_end = 22999
allowed_images = ["ubuntu:22.04", "nvidia/cuda:12.4.1-base-ubuntu22.04"]
network = ""
