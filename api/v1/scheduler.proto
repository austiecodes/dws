syntax = "proto3";

package dws.api.v1;

option go_package = "github.com/austiecodes/dws/internal/lib/apis/schedulerpb";

message WorkerPollRequest {
  string worker_id = 1;
  int32 max_tasks = 2;
  int32 running_tasks = 3;
  map<string, string> metadata = 4;
}

message TaskAssignment {
  uint64 task_id = 1;
  string container_id = 2;
  string command = 3;
  string task_type = 4;
  uint64 container_record_id = 5;
  string container_uuid = 6;
  uint64 user_id = 7;
}

message TaskResult {
  uint64 task_id = 1;
  string worker_id = 2;
  int32 exit_code = 3;
  string output = 4;
  string error = 5;
  string status = 6;
}

message Heartbeat {
  string worker_id = 1;
  string status = 2;
  int32 running_tasks = 3;
  int32 capacity = 4;
  int64 timestamp_ms = 5;
  map<string, string> metadata = 6;
  int32 ttl_secs = 7;
}

message Ack {
  string message = 1;
}

service SchedulerService {
  rpc PollTasks(stream WorkerPollRequest) returns (stream TaskAssignment);
  rpc ReportTaskResult(TaskResult) returns (Ack);
  rpc SendHeartbeat(stream Heartbeat) returns (Ack);
}
